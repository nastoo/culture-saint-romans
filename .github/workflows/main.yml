name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # if you use themes as git submodules

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true                 # needed if you use SCSS or Hugo Pipes

      - name: Build the site
        run: hugo --minify

      - name: Deploy to server via rsync
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SERVER_USER }}
          server: ${{ secrets.SERVER_IP }}
          port: 22
          local_path: './public/*'
          remote_path: '~/'
          sftp_only: true
          password: ${{ secrets.SERVER_PASSWORD }}          
